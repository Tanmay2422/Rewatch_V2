groups:
  - name: rewatch
    rules:
      - alert: RewatchDown
        expr: up{job="rewatch"} == 0
        for: 1m
        labels: { severity: critical }
        annotations: { summary: "ReWatch app is down" }
      - alert: HighErrorRate
        expr: sum(rate(rewatch_http_requests_total{status=~"5.."}[5m])) > 0.1
        for: 2m
        labels: { severity: warning }
        annotations: { summary: "High 5xx error rate" }
