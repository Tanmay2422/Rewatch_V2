apiVersion: apps/v1
kind: Deployment
metadata:
  name: rewatch
spec:
  replicas: 2
  selector:
    matchLabels: { app: rewatch }
  template:
    metadata:
      labels: { app: rewatch }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: rewatch
          image: rewatch:local        # for minikube; or ghcr.io/<user>/rewatch:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 5000 }]
          env:
            - name: SESSION_SECRET
              value: change-me
          readinessProbe:
            httpGet: { path: /health, port: 5000 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 5000 }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: rewatch
spec:
  type: NodePort
  selector: { app: rewatch }
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30080
